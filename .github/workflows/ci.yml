name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://erp:erp@localhost:5432/erp
  BETTER_AUTH_SECRET: "12345678901234567890123456789012"
  BETTER_AUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - name: Capture reproducible lint output
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducible-lint-output
          path: lint-output.txt
      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

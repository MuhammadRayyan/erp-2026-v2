name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

env:
  DATABASE_URL: postgresql://erp:erp@localhost:5432/erp
  BETTER_AUTH_SECRET: "12345678901234567890123456789012"
  BETTER_AUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Commit generated package lock
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add generated package lock"
          git push origin HEAD:${{ github.head_ref }}
      - run: npm run db:generate
      - name: Capture lint output
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee lint-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-output
          path: lint-output.txt
      - name: Enforce lint result
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

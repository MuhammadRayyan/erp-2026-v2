name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://erp:erp@localhost:5432/erp
  BETTER_AUTH_SECRET: "12345678901234567890123456789012"
  BETTER_AUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  MAILPIT_URL: http://localhost:8025
  SMTP_HOST: localhost
  SMTP_PORT: 1025
  SMTP_SECURE: "false"
  EMAIL_FROM: ERP 2026 <no-reply@localhost>
  OUTBOX_WORKER_SECRET: "12345678901234567890123456789012"
  OUTBOX_POLL_SECONDS: 2

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Verify clean migration integrity
        run: |
          set -euo pipefail
          npm run db:status
          set +e
          npx prisma migrate diff \
            --from-schema prisma \
            --to-config-datasource \
            --script \
            --exit-code > prisma-schema-diff.sql
          schema_diff_code=$?
          set -e
          if [ "$schema_diff_code" -ne 0 ]; then
            echo "Prisma-supported schema drift detected:" >&2
            cat prisma-schema-diff.sql >&2
            exit "$schema_diff_code"
          fi
          npm run db:verify-integrity
      - name: Verify base-to-head migration upgrade
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPGRADE_DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_upgrade
        run: bash scripts/verify-migration-upgrade.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end verification
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          touch .env
          npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build migration image
        run: docker build --target migrate -t erp-2026-v2:migrate .
      - name: Build runtime image
        run: docker build --target runtime -t erp-2026-v2:runtime .
      - name: Smoke runtime and outbox endpoint
        run: |
          set -euo pipefail
          docker run -d --name erp-web-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            -e BETTER_AUTH_URL="$BETTER_AUTH_URL" \
            -e APP_URL="$APP_URL" \
            -e SMTP_HOST="$SMTP_HOST" \
            -e SMTP_PORT="$SMTP_PORT" \
            -e SMTP_SECURE="$SMTP_SECURE" \
            -e EMAIL_FROM="$EMAIL_FROM" \
            -e OUTBOX_WORKER_SECRET="$OUTBOX_WORKER_SECRET" \
            -e FILE_STORAGE_PROVIDER=local \
            -e FILE_STORAGE_ROOT=/tmp/erp-private \
            erp-2026-v2:runtime
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health > health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker logs erp-web-ci
            exit 1
          fi
          grep -q '"database":"ready"' health.json
          curl --fail --silent --request POST \
            --header "Authorization: Bearer $OUTBOX_WORKER_SECRET" \
            http://localhost:3000/api/internal/outbox/process > outbox.json
          grep -q '"claimed"' outbox.json
      - name: Stop smoke container
        if: always()
        run: docker rm -f erp-web-ci 2>/dev/null || true

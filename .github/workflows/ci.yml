name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://erp:erp@localhost:5432/erp
  BETTER_AUTH_SECRET: "12345678901234567890123456789012"
  BETTER_AUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Run integration tests
        run: npm run test:integration 2>&1 | tee integration-output.txt
      - name: Upload integration output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-ui-integration-output
          path: integration-output.txt
      - run: npm run build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-before-remote-use}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      EMAIL_FROM: ERP 2026 <no-reply@localhost>
      OUTBOX_WORKER_SECRET: ${OUTBOX_WORKER_SECRET:-local-outbox-worker-secret-change-123456789}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-5}
      FILE_STORAGE_PROVIDER: local
      FILE_STORAGE_ROOT: /app/storage/private
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-10485760}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "3000:3000"
    volumes:
      - private_files:/app/storage/private

  worker:
    build:
      context: .
      target: runtime
    environment:
      OUTBOX_WORKER_URL: http://web:3000/api/internal/outbox/process
      OUTBOX_WORKER_SECRET: ${OUTBOX_WORKER_SECRET:-local-outbox-worker-secret-change-123456789}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-5}
    depends_on:
      web:
        condition: service_healthy
    command:
      - node
      - -e
      - "const sleep=(ms)=>new Promise((resolve)=>setTimeout(resolve,ms));(async()=>{for(;;){try{const response=await fetch(process.env.OUTBOX_WORKER_URL,{method:'POST',headers:{authorization:'Bearer '+process.env.OUTBOX_WORKER_SECRET}});if(!response.ok)console.error('Outbox worker request failed',response.status);}catch(error){console.error('Outbox worker request failed',error instanceof Error?error.message:String(error));}await sleep(Number(process.env.OUTBOX_POLL_SECONDS||5)*1000);}})();"
    restart: unless-stopped

volumes:
  postgres_data:
  private_files:

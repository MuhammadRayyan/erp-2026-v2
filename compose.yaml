services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://erp:erp@db:5432/erp
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-before-remote-use}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      EMAIL_FROM: ERP 2026 <no-reply@localhost>
      FILE_STORAGE_PROVIDER: local
      FILE_STORAGE_ROOT: /app/storage/private
      FILE_MAX_BYTES: ${FILE_MAX_BYTES:-10485760}
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - private_files:/app/storage/private

volumes:
  postgres_data:
  private_files:
